<!DOCTYPE html>
<html>
<head>
  <title>ESP32 Dual Joystick Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      margin: 0; 
      padding: 20px; 
      background-color: #f4f4f4; 
      color: #333; 
    }
    h1, h2 { 
      color: #0056b3; 
    }
    .container { 
      display: flex; 
      flex-wrap: wrap; 
      justify-content: center; 
      gap: 20px; 
      max-width: 1200px; 
      margin: 20px auto; 
    }
    .joystick-panel { 
      background-color: #fff; 
      border-radius: 8px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
      padding: 20px; 
      width: 45%; 
      min-width: 300px; 
    }
    .joystick-axes, .joystick-buttons { 
      margin-bottom: 15px; 
    }
    .joystick-axes label, .joystick-buttons label { 
      display: block; 
      margin-bottom: 5px; 
      font-weight: bold; 
    }
    .slider-container { 
      display: flex; 
      align-items: center; 
      margin-bottom: 10px; 
    }
    .slider-container label { 
      flex: 0 0 60px; 
      text-align: left; 
    }
    input[type="range"] { 
      flex-grow: 1; 
      margin: 0 10px; 
    }
    .button-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); 
      gap: 10px; 
    }
    button { 
      padding: 10px 15px; 
      border: none; 
      border-radius: 5px; 
      background-color: #007bff; 
      color: white; 
      cursor: pointer; 
      font-size: 1em; 
    }
    button.active { 
      background-color: #28a745; 
    } /* Cor para botão ligado (verde) */
    button:active:not(.active) { 
      background-color: #0056b3; 
    } /* Cor ao pressionar, se não estiver ativo */
    #status { 
      margin-top: 20px; 
      font-weight: bold; 
      color: #007bff; 
    }
  </style>
</head>
<body>
  <h1>ESP32 Dual Joystick Dashboard</h1>
  <p id="status">Conectando ao WebSocket...</p>

  <div class="container">
    <div class="joystick-panel">
      <h2>Joystick Esquerdo</h2>
      <div class="joystick-axes">
        <h3>Eixos (X)</h3>
        <div class="slider-container"><label>Joy_Esq(Y):</label><input type="range" id="jp_eixo1x" min="-100" max="100" value="0"></div>
        <div class="slider-container"><label>Joy_Esq(X):</label><input type="range" id="jp_eixo2x" min="-100" max="100" value="0"></div>
        <div class="slider-container"><label>bAnalog(1):</label><input type="range" id="jp_eixo3x" min="-100" max="100" value="0"></div>
        <div class="slider-container"><label>bAnalog(2):</label><input type="range" id="jp_eixo4x" min="-100" max="100" value="0"></div>
        <div class="slider-container"><label>bAnalog(3):</label><input type="range" id="jp_eixo5x" min="-100" max="100" value="0"></div>
        <div class="slider-container"><label>Pedal_Esqu:</label><input type="range" id="jp_eixo6x" min="-100" max="100" value="0"></div>
        <div class="slider-container"><label>Pedal_Dire:</label><input type="range" id="jp_eixo7x" min="-100" max="100" value="0"></div>
        <div class="slider-container"><label>Pedal_Adic:</label><input type="range" id="jp_eixo8x" min="-100" max="100" value="0"></div>
      </div>
      <div class="joystick-buttons">
        <h3>Botoes</h3>
        <div class="button-grid">
          <button id="jp_btn1">Btn 1</button><button id="jp_btn2">Btn 2</button><button id="jp_btn3">Btn 3</button><button id="jp_btn4">Btn 4</button>
          <button id="jp_btn5">Btn 5</button><button id="jp_btn6">Btn 6</button><button id="jp_btn7">Btn 7</button><button id="jp_btn8">Btn 8</button>
          <button id="jp_btn9">Btn 9</button><button id="jp_btn10">Bt 10</button><button id="jp_btn11">Bt 11</button><button id="jp_btn12">Bt 12</button>
        </div>
      </div>
    </div>

    <div class="joystick-panel">
      <h2>Joystick 2</h2>
      <div class="joystick-axes">
        <h3>Eixos (X)</h3>
        <div class="slider-container"><label>Joy_Dir(Y):</label><input type="range" id="j2_eixo1x" min="-100" max="100" value="0"></div>
        <div class="slider-container"><label>Joy_Dir(X):</label><input type="range" id="j2_eixo2x" min="-100" max="100" value="0"></div>
        <div class="slider-container"><label>bAnalog(1):</label><input type="range" id="j2_eixo3x" min="-100" max="100" value="0"></div>
        <div class="slider-container"><label>bAnalog(2):</label><input type="range" id="j2_eixo4x" min="-100" max="100" value="0"></div>
        <div class="slider-container"><label>bAnalog(3):</label><input type="range" id="j2_eixo5x" min="-100" max="100" value="0"></div>
      </div>
      <div class="joystick-buttons">
        <h3>Teclado</h3>
        <div class="button-grid">
          <script>
            // Gera 24 botões dinamicamente
            for (let i = 1; i <= 24; i++) {
              document.write('<button id="j2_btn' + i + '">T ' + i + '</button>');
            }
          </script>
        </div>
      </div>
    </div>
  </div>

  <script>
    // IMPORTANTE: SUBSTITUA 'SEU_IP_DO_ESP32' PELO ENDEREÇO IP REAL DO SEU ESP32
    // Exemplo: var gateway = `ws://192.168.1.100:81/`;
    var gateway = `ws://10.0.0.13:81/`; 
    
    var websocket;
    window.addEventListener('load', onLoad);

    function onLoad(event) {
      initWebSocket();
    }

    function initWebSocket() {
      console.log('Tentando abrir uma conexão WebSocket...');
      websocket = new WebSocket(gateway);
      websocket.onopen = onOpen;
      websocket.onclose = onClose;
      websocket.onmessage = onMessage;
    }

    function onOpen(event) {
      console.log('Conexão WebSocket aberta');
      document.getElementById('status').innerText = 'Conectado ao ESP32!';
      sendData(); // Envia o estado inicial ao conectar
    }

    function onClose(event) {
      console.log('Conexão WebSocket fechada');
      document.getElementById('status').innerText = 'Desconectado. Tentando reconectar...';
      setTimeout(initWebSocket, 2000); // Tenta reconectar após 2 segundos
    }

    function onMessage(event) {
      console.log("Mensagem do ESP32: " + event.data);
    }

    // Função para coletar e enviar dados
    function sendData() {
      let data = {
        joystickPrincipal: {
          eixos: {
            eixo1: { x: parseFloat(document.getElementById('jp_eixo1x').value) },
            eixo2: { x: parseFloat(document.getElementById('jp_eixo2x').value) },
            eixo3: { x: parseFloat(document.getElementById('jp_eixo3x').value) },
            eixo4: { x: parseFloat(document.getElementById('jp_eixo4x').value) },
            eixo5: { x: parseFloat(document.getElementById('jp_eixo5x').value) },
            eixo6: { x: parseFloat(document.getElementById('jp_eixo6x').value) },
            eixo7: { x: parseFloat(document.getElementById('jp_eixo7x').value) },
            eixo8: { x: parseFloat(document.getElementById('jp_eixo8x').value) }
          },
          botoes: {}
        },
        joystick2: {
          eixos: {
            eixo1: { x: parseFloat(document.getElementById('j2_eixo1x').value) },
            eixo2: { x: parseFloat(document.getElementById('j2_eixo2x').value) },
            eixo3: { x: parseFloat(document.getElementById('j2_eixo3x').value) },
            eixo4: { x: parseFloat(document.getElementById('j2_eixo4x').value) },
            eixo5: { x: parseFloat(document.getElementById('j2_eixo5x').value) }
          },
          botoes: {}
        }
      };

      // Coleta o estado dos botões do Joystick Principal
      for (let i = 1; i <= 12; i++) {
        let btn = document.getElementById('jp_btn' + i);
        data.joystickPrincipal.botoes['btn' + i] = btn.classList.contains('active');
      }

      // Coleta o estado dos botões do Joystick 2
      for (let i = 1; i <= 24; i++) {
        let btn = document.getElementById('j2_btn' + i);
        data.joystick2.botoes['btn' + i] = btn.classList.contains('active');
      }

      // Só envia se a conexão WebSocket estiver aberta
      if (websocket.readyState === WebSocket.OPEN) {
        websocket.send(JSON.stringify(data));
      }
    }

    // Adiciona listeners para os sliders (eixos)
    document.querySelectorAll('input[type="range"]').forEach(slider => {
      slider.addEventListener('input', sendData); // Envia dados ao arrastar o slider
    });

    // Adiciona listeners para os botões (clique toggle)
    document.querySelectorAll('.button-grid button').forEach(button => {
      button.addEventListener('click', () => {
        button.classList.toggle('active'); // Alterna a classe 'active'
        sendData(); // Envia o novo estado
      });
      // Para dispositivos touch:
      button.addEventListener('touchend', (e) => {
        // Evita o disparo duplo em alguns browsers (touch e click)
        if (e.target === button) {
            e.preventDefault();
            button.classList.toggle('active');
            sendData();
        }
      }, { passive: false });
    });

    // Envia dados periodicamente para garantir que o ESP32 receba atualizações
    setInterval(sendData, 500); // Envia a cada 500ms (meio segundo)
  </script>
</body>
</html>
